name: tests

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0  # setup-uv publishes full versions only, no major-version tag
        with:
          python-version: "3.12"
      # Text chat plus the serve and weather extras. The voice extras (torch; ~6 GB with CUDA) stay out: the
      # tests fake the GPU, the microphone and the speech models, and the torch-only ones skip.
      - run: uv sync --frozen --extra serve --extra weather
      # Test-only packages: numpy and soundfile for the audio fakes, pillow for library thumbnails, httpx2
      # for starlette's TestClient, pytest for test_int8's markers.
      - run: uv pip install numpy soundfile pillow pytest httpx2
      - run: uv run --frozen --no-sync python -m unittest discover -s tests
