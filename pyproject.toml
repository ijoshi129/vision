[project]
name = "vision"
version = "0.1.0"
description = "Vision: a local voice + text AI assistant driven by your Claude Code subscription"
requires-python = ">=3.11"
dependencies = [
  "kokoro-onnx>=0.4",
  "onnxruntime>=1.20",
  "faster-whisper>=1.1",
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12",
  "sounddevice>=0.5",
  "soundfile>=0.12",
  "numpy",
  "typer>=0.12",
  "rich>=13",
  "prompt_toolkit>=3.0",
  "webrtcvad-wheels",
]

[project.scripts]
vision = "vision.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["vision"]
