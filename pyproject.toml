[project]
name = "vision"
version = "0.1.0"
description = "A terminal voice + text AI assistant driven by your Claude Code, OpenAI Codex or Grok subscription"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.11"
keywords = ["assistant", "voice", "tts", "speech-to-text", "claude-code", "codex", "grok", "cli"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: End Users/Desktop",
  "Intended Audience :: Developers",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]
# The core install is the text chat: it runs anywhere Python and one of the brain CLIs do.
dependencies = [
  "typer>=0.12",
  "rich>=13",
  "prompt_toolkit>=3.0",
  "tzdata; sys_platform == 'win32'",  # zoneinfo's time-zone database (weather); Linux and macOS ship one
]

[project.optional-dependencies]
# Speech in and out: Qwen3-TTS, faster-whisper, the mic and VAD. Built for Linux with an NVIDIA GPU;
# everything falls back to the CPU, but speech is then several times slower than real time.
voice = [
  "onnxruntime-gpu==1.22.0",  # CUDA 12 build; shares the nvidia-*-cu12 libs with CTranslate2. Works on CPU too.
  "faster-whisper>=1.1",
  "nvidia-cublas-cu12",
  "nvidia-cudnn-cu12",
  "nvidia-cuda-runtime-cu12",
  "nvidia-cuda-nvrtc-cu12",
  "nvidia-cufft-cu12",
  "nvidia-curand-cu12",
  "sounddevice>=0.5",
  "soundfile>=0.12",
  "numpy",
  "webrtcvad-wheels",
  "qwen-tts>=0.1.1",
  # PyPI's Windows torch wheels are CPU-only; uv takes these from PyTorch's CUDA index (tool.uv.sources).
  "torch; sys_platform == 'win32'",
  "torchaudio; sys_platform == 'win32'",
  # WebRTC echo cancellation (vision/echo.py): Windows has no system module Vision can switch on.
  "livekit; sys_platform == 'win32'",
]
# `vision serve`: HTTP + WebSocket API for remote clients and the pairing QR code
serve = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "python-multipart>=0.0.9",
  "qrcode>=7",
]
# `vision weather`: ES256 signing of Apple WeatherKit tokens (needs an Apple Developer account)
weather = ["cryptography>=42"]
all = ["vision[voice,serve,weather]"]

[project.urls]
Homepage = "https://github.com/domdevz/vision"
Issues = "https://github.com/domdevz/vision/issues"

[project.scripts]
vision = "vision.__main__:run"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.uv]
# faster-whisper depends on the CPU-only `onnxruntime`, which unpacks into the same package directory
# as onnxruntime-gpu and silently puts the SNAC decoder and Silero VAD back on the CPU after every `uv sync`.
# The marker never matches, so the CPU wheel drops out of resolution; onnxruntime-gpu provides the import.
override-dependencies = ["onnxruntime; sys_platform == 'never'"]

[tool.uv.sources]
# Windows only: Linux keeps PyPI's torch, which already carries CUDA there.
torch = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]
torchaudio = [{ index = "pytorch-cu130", marker = "sys_platform == 'win32'" }]

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.setuptools]
packages = ["vision"]
